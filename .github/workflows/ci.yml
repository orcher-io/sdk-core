name: CI

# Runs on GitHub-hosted runners only. Pull requests from forks run here too,
# so this workflow must never target a self-hosted runner or read secrets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --lib --tests
      # A field added to orcher-proto must not break this crate's build.
      - name: Proto messages leave room for new fields
        run: python3 scripts/check-proto-literals.py
      # Generated protocol types stay behind src/wire/.
      - name: Generated types stay behind the wire
        run: python3 scripts/check-wire-boundary.py
      - name: Doc examples
        run: cargo test --workspace --doc
      - name: Docs build without warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The public API names no generated protocol type, so a new orcher-proto
      # changes nothing a language SDK compiles against.
      - name: No generated types in the public API
        run: python3 scripts/check-public-surface.py
      # Builds both crates exactly as crates.io would receive them.
      - run: cargo package --workspace --exclude orcher-bench --exclude orcher-verify

  # On a release PR: the new version must be at least as big a step as the
  # public API changed by, so a breaking change is never released as a patch,
  # which every language SDK would then pick up without being changed for it.
  semver:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: orcher-sdk-core
