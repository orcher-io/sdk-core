[package]
name = "orcher-bench"
version = "0.17.1"
edition = "2021"
license = "Apache-2.0"
description = "On-demand benchmark suite for ORCHER workers and the engine (not published, not run in CI)"
publish = false

# Protocol messages are built with `..Default::default()` (see the workspace
# lints in ../Cargo.toml).
[lints]
workspace = true

[dependencies]
# The worker under test is this checkout's core and host, so a change to
# either is what the suite measures.
orcher-sdk-core = { path = ".." }
orcher-sdk-host = { path = "../host" }
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
# The counting proxy between the worker and the engine.
hyper = { version = "1", features = ["client", "server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
http-body = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
# The worker's logs, to stderr, when RUST_LOG asks for them.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
