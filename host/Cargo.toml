[package]
name = "orcher-sdk-host"
version = "0.14.0" # x-release-please-version
edition = "2021"
license = "Apache-2.0"
authors = ["ORCHER Contributors"]
repository = "https://github.com/orcher-io/sdk-core"
readme = "README.md"
description = "Worker host for ORCHER SDKs: one worker's plumbing (drivers, lifecycle, work hand-off, registration) shared by every language"
keywords = ["orchestration", "workflow", "worker", "sdk"]
categories = ["asynchronous", "network-programming"]

[dependencies]
# Released together with the host, at the same version.
orcher-sdk-core = { path = "..", version = "0.14.0" } # x-release-please-version
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
