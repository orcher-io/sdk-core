[package]
name = "orcher-sdk-core"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
authors = ["ORCHER Contributors"]
repository = "https://github.com/orcher-io/sdk-core"
readme = "README.md"
description = "Core SDK for ORCHER orchestration platform - handles gRPC communication, state machines, and replay engine"
keywords = ["orchestration", "workflow", "distributed", "sdk"]
categories = ["asynchronous", "network-programming"]

[dependencies]
# Protocol definitions
orcher-proto = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# gRPC client
# h2 is tonic's HTTP/2; named here only to read the reason on a stream the
# server refused, which tells a live server from a broken connection.
h2 = "0.4"
tonic = { version = "0.12", features = ["transport", "codegen", "prost", "tls", "tls-native-roots"] }
prost = "0.13"
prost-types = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Caching and data structures
lru = "0.12"
parking_lot = "0.12"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Utilities
bytes = "1.0"
futures = "0.3"

# Compression (for codec module)
flate2 = "1.0"

# Encryption (for codec module)
aes-gcm = "0.10"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
proptest = "1.0"
tokio-stream = { version = "0.1", features = ["net"] }
uuid = { version = "1.0", features = ["v4"] }
tracing-subscriber = "0.3"
# A bare HTTP/2 server, to answer calls in ways a tonic server never does.
http = "1"

[features]
default = []
test-utils = []
