[package]
name = "orcher-sdk-core"
version = "0.22.1"
edition = "2021"
license = "Apache-2.0"
authors = ["ORCHER Contributors"]
repository = "https://github.com/orcher-io/sdk-core"
readme = "README.md"
description = "Core SDK for ORCHER orchestration platform - handles gRPC communication, state machines, and replay engine"
keywords = ["orchestration", "workflow", "distributed", "sdk"]
categories = ["asynchronous", "network-programming"]

[dependencies]
# Protocol definitions
orcher-proto = "0.15"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# gRPC client
# h2 is tonic's HTTP/2; named here only to read the reason on a stream the
# server refused, which tells a live server from a broken connection.
h2 = "0.4"
tonic = { version = "0.12", features = ["transport", "codegen", "prost", "tls", "tls-native-roots"] }
prost = "0.13"
prost-types = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: without it serde_json parses about a third of all f64
# values one unit in the last place off, so a float in a payload could come
# back as a different number. Features unify, so this also holds for every
# SDK built on core.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
bincode = "1.3"

# Caching and data structures
lru = "0.12"
parking_lot = "0.12"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Utilities
bytes = "1.0"
futures = "0.3"

# Compression (for codec module)
flate2 = "1.0"

# Encryption (for codec module)
aes-gcm = "0.10"
rand = "0.8"
# The kernel's deterministic random source derives its seed with SHA-256.
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
proptest = "1.0"
tokio-stream = { version = "0.1", features = ["net"] }
uuid = { version = "1.0", features = ["v4"] }
tracing-subscriber = "0.3"
# A bare HTTP/2 server, to answer calls in ways a tonic server never does.
http = "1"

# Protocol messages are built with `..Default::default()` even when every
# field is set today, so a field added to orcher-proto leaves this workspace
# building (scripts/check-proto-literals.py keeps it that way).
[lints]
workspace = true

[features]
default = []
test-utils = []

# The benchmark suite is built in this workspace and never published. The
# verify suite (verify/README.md) is a crate of its own, published apart:
# it holds the recorded runs the replay tests read, so they are not part of
# this crate.
[workspace]
members = ["bench", "verify"]
resolver = "2"

[workspace.lints.clippy]
# See [lints] above: the struct update is there for fields not yet added.
needless_update = "allow"
